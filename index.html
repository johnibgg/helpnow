<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/helpnow/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="HelpNow — un besoin, une mise en relation, une solution. Marketplace universelle de services.">
  <meta name="theme-color" content="#0B1623">

  <!-- PWA / iOS : installable « Ajouter à l'écran d'accueil » -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HelpNow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HelpNow</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B1623; }
    /* Splash de chargement branché (retiré au 1er frame Flutter). */
    #helpnow-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(60% 45% at 85% 12%, rgba(255,138,115,0.22), transparent 70%),
        linear-gradient(160deg, #132A3E 0%, #0B1623 70%);
      transition: opacity .45s ease; opacity: 1;
      font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    }
    #helpnow-splash.hidden { opacity: 0; pointer-events: none; }
    #helpnow-splash img { width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45); }
    #helpnow-splash .wm { margin-top: 20px; font-size: 26px; font-weight: 800;
      letter-spacing: -0.3px; color: #EAEFF4; }
    #helpnow-splash .wm b { color: #FB7A64; font-weight: 800; }
    #helpnow-splash .bar { margin-top: 26px; width: 132px; height: 3px;
      border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #helpnow-splash .bar::after { content: ""; display: block; height: 100%; width: 40%;
      border-radius: 3px; background: #FB7A64; animation: hn-slide 1.1s ease-in-out infinite; }
    @keyframes hn-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(330%); } }
    @media (prefers-reduced-motion: reduce) { #helpnow-splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="helpnow-splash">
    <img src="icons/Icon-192.png" alt="HelpNow">
    <div class="wm">Help<b>Now</b></div>
    <div class="bar"></div>
  </div>

  <script>
    // Retire le splash dès que Flutter a peint sa première frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('helpnow-splash');
      if (s) { s.classList.add('hidden'); setTimeout(function () { s.remove(); }, 500); }
    });

    // ── Mise à jour automatique du service worker (PWA) ──────────────────────
    // Évite que les utilisateurs (surtout « Ajouter à l'écran d'accueil ») restent
    // coincés sur un vieux build en cache. On force la vérification des MàJ au
    // démarrage puis périodiquement ; quand une NOUVELLE version s'active (le SW
    // Flutter fait skipWaiting), on recharge UNE fois pour qu'elle prenne le
    // contrôle (le reload suffit, pas besoin de clients.claim). Pas de reload à la
    // toute première installation, pas de boucle.
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      function doReload() { if (!reloaded) { reloaded = true; window.location.reload(); } }
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController) doReload(); else hadController = true; // 1re install : pas de reload
      });
      navigator.serviceWorker.ready.then(function (reg) {
        function watch(w) {
          if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'activated' && hadController) doReload();
          });
        }
        watch(reg.waiting);
        reg.addEventListener('updatefound', function () { watch(reg.installing); });
        var check = function () { try { reg.update(); } catch (e) {} };
        check();                                // au démarrage
        setInterval(check, 30 * 60 * 1000);     // puis toutes les 30 min
      }).catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
